# 前端容器内的 Nginx 配置：
#   1) React SPA 静态文件（history 路由回退到 index.html）
#   2) /api/* 反向代理到 server:7001（浏览器只访问 web 端口，无跨域问题）
#
# server_upstream 用变量 + Docker 内置 DNS（127.0.0.11）解析，
# 这样 server 容器重建换 IP 后，nginx 不需要重启也能重新解析。

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $server_upstream server:7001;

    location /api/ {
        proxy_pass http://$server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # Vite 产物文件名带 hash，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 入口页不缓存，保证重新发布后能拿到新资源
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
