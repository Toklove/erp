kind: pipeline
type: docker
name: deploy

trigger:
  branch:
    - main
  event:
    - push

steps:
  - name: deploy
    image: docker:latest
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
      - name: app
        path: /erp
    commands:
      - apk add --no-cache git
      - cd /erp
      - git pull origin main
      - docker compose down
      - docker compose up -d --build

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock
  - name: app
    host:
      path: /root/erp