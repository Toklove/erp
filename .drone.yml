kind: pipeline
type: docker
name: deploy

trigger:
  branch:
    - main
  event:
    - push

steps:
  - name: build
    image: docker:latest
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - cd /erp
      - git pull origin main
      - docker compose down
      - docker compose up -d --build

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock
