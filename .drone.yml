kind: pipeline
type: docker
name: deploy

trigger:
  branch:
    - main
  event:
    - push

steps:
  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: server_host
      username:
        from_secret: server_user
      key:
        from_secret: ssh_key
      port: 22
      script:
        - cd /erp
        - git pull origin main
        - docker compose down
        - docker compose up -d --build